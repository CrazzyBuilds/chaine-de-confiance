name: Publication

on:
  push:
    branches: [main]

# Par défaut, le GITHUB_TOKEN de la CI n'a aucun droit : chaque job ne
# demande que ce dont il a besoin.
permissions: {}

env:
  IMAGE: ghcr.io/crazzybuilds/chaine-de-confiance

# Les actions sont épinglées par l'empreinte de leur commit, pas par leur tag :
# un tag (v7) peut être déplacé vers un autre code, comme un tag d'image.
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Récupération du code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Installation de Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm

      - run: npm ci
      - run: npm run build
      - run: npm test

  publier:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # pousser l'image sur GHCR
      id-token: write # obtenir le jeton OIDC de GitHub, pour signer (keyless)
    steps:
      - name: Récupération du code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Construction de l'image (pas encore publiée)
        run: docker build -t "$IMAGE:$GITHUB_SHA" .

      # Le scan compare le contenu de l'image (paquets Alpine, Node, modules
      # npm) aux bases de failles connues (CVE). Le verdict (même script qu'en
      # local) bloque la publication si la distribution est en fin de vie ou
      # s'il reste une faille grave corrigeable.
      - name: Scan des vulnérabilités
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}:${{ github.sha }}
          scanners: vuln
          format: json
          output: trivy.json

      - name: Verdict du scan
        run: scripts/verdict-scan.sh trivy.json

      - name: Connexion à GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publication
        id: publication
        run: |
          docker tag "$IMAGE:$GITHUB_SHA" "$IMAGE:latest"
          docker push "$IMAGE:$GITHUB_SHA"
          docker push "$IMAGE:latest"
          # Le digest : l'empreinte du contenu publié, qui ne bouge jamais.
          DIGEST=$(docker inspect -f '{{index .RepoDigests 0}}' "$IMAGE:$GITHUB_SHA" | cut -d@ -f2)
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
          echo "Digest publié : $DIGEST" >> "$GITHUB_STEP_SUMMARY"

      - name: Installation de cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      # Signature keyless : pas de clé privée à garder. cosign présente le
      # jeton OIDC de la CI (« je suis publication.yml de ce repo, sur main »)
      # à Fulcio, l'autorité de Sigstore, qui délivre un certificat valable
      # 10 minutes pour cette identité. La signature porte sur le digest (le
      # contenu exact), et elle est inscrite dans Rekor, un journal public.
      - name: Signature de l'image
        env:
          DIGEST: ${{ steps.publication.outputs.digest }}
        run: cosign sign --yes "$IMAGE@$DIGEST"
